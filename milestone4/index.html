<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineScope — Milestone 4</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- NAV -->
  <nav>
    <div class="nav-inner">
      <span class="nav-logo">Cine<span class="logo-badge">Scope</span></span>
      <ul>
        <li><a href="#" id="nav-collection" class="nav-link active">Collection</a></li>
        <li><a href="#" id="nav-search" class="nav-link">Search</a></li>
      </ul>
    </div>
  </nav>

  <!-- MAIN -->
  <main>

    <!-- COLLECTION SECTION (popular + top-rated tabs) -->
    <section id="collection-section" class="section">
      <div class="section-header">
        <div class="sub-tabs">
          <button class="sub-tab active" id="tab-popular">Popular</button>
          <button class="sub-tab" id="tab-toprated">Top Rated</button>
        </div>
        <div class="view-toggle">
          <button class="view-btn active" id="view-grid-collection" title="Grid view">&#9783;</button>
          <button class="view-btn" id="view-list-collection" title="List view">&#9776;</button>
        </div>
      </div>
      <div id="collection-results" class="card-grid"></div>
      <p id="collection-loading" class="loading-msg">Loading movies...</p>
    </section>

    <!-- SEARCH SECTION -->
    <section id="search-section" class="section hidden">
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search for a movie..." autocomplete="off" />
        <button id="search-btn">Search</button>
      </div>

      <div id="search-results-wrap" class="hidden">
        <div class="section-header">
          <h2 id="search-heading">Results</h2>
          <div class="controls-right">
            <div class="view-toggle">
              <button class="view-btn active" id="view-grid-search" title="Grid view">&#9783;</button>
              <button class="view-btn" id="view-list-search" title="List view">&#9776;</button>
            </div>
            <div class="pagination" id="search-pagination"></div>
          </div>
        </div>
        <div id="search-results" class="card-grid"></div>
        <div class="pagination bottom" id="search-pagination-bottom"></div>
      </div>

      <p id="search-empty" class="empty-msg hidden">No results found. Try a different keyword.</p>
    </section>

    <!-- DETAIL PANEL -->
    <section id="detail-section" class="section hidden">
      <button id="detail-back" class="back-btn">&larr; Back</button>
      <div id="detail-content"></div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer>
    <p>Data provided by <a href="https://www.themoviedb.org" target="_blank">TMDB</a> &mdash; IT 4403 Milestone 4</p>
  </footer>

  <!-- MUSTACHE TEMPLATES -->

  <!-- Card template (grid view) -->
  <script id="tpl-card" type="text/template">
    <div class="movie-card" data-id="{{id}}">
      {{#poster_url}}
        <img src="{{poster_url}}" alt="{{title}} poster" loading="lazy" />
      {{/poster_url}}
      {{^poster_url}}
        <div class="no-poster">No Image</div>
      {{/poster_url}}
      <div class="card-body">
        <div class="card-title">{{title}}</div>
        <div class="card-year">{{year}}</div>
        {{#rating}}<div class="card-rating">&#9733; {{rating}}</div>{{/rating}}
      </div>
    </div>
  </script>

  <!-- Card template (list view) -->
  <script id="tpl-list-item" type="text/template">
    <div class="list-item" data-id="{{id}}">
      {{#poster_url}}
        <img src="{{poster_url}}" alt="{{title}} poster" loading="lazy" />
      {{/poster_url}}
      {{^poster_url}}
        <div class="no-poster list-no-poster">No Image</div>
      {{/poster_url}}
      <div class="list-body">
        <div class="list-title">{{title}}</div>
        <div class="list-meta">
          <span class="list-year">{{year}}</span>
          {{#rating}}<span class="list-rating">&#9733; {{rating}}</span>{{/rating}}
          {{#overview}}<p class="list-overview">{{overview}}</p>{{/overview}}
        </div>
      </div>
    </div>
  </script>

  <!-- Detail template -->
  <script id="tpl-detail" type="text/template">
    <div class="detail-card">
      {{#poster_url}}
        <img src="{{poster_url}}" alt="{{title}} poster" />
      {{/poster_url}}
      {{^poster_url}}
        <div class="detail-no-poster">No Image</div>
      {{/poster_url}}
      <div class="detail-body">
        <h1 class="detail-title">{{title}}</h1>
        <div class="detail-meta">
          {{#rating}}<span class="badge">&#9733; {{rating}}</span>{{/rating}}
          {{#year}}<span>{{year}}</span>{{/year}}
          {{#runtime}}<span>{{runtime}}</span>{{/runtime}}
          {{#language}}<span class="tag">{{language}}</span>{{/language}}
          {{#genres}}
            <span class="tag">{{name}}</span>
          {{/genres}}
        </div>
        <p class="detail-overview">{{overview}}</p>
        {{#tagline}}<p class="detail-tagline">&ldquo;{{tagline}}&rdquo;</p>{{/tagline}}
      </div>
    </div>
  </script>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/mustache.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
