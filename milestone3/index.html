<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineScope — Milestone 3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- NAV -->
  <nav>
    <div class="nav-inner">
      <span class="nav-logo">Cine<span class="logo-badge">Scope</span></span>
      <ul>
        <li><a href="#" id="nav-popular" class="nav-link active">Popular</a></li>
        <li><a href="#" id="nav-search" class="nav-link">Search</a></li>
      </ul>
    </div>
  </nav>

  <!-- MAIN -->
  <main>

    <!-- SEARCH PANEL (hidden by default, shown when Search tab active) -->
    <section id="search-section" class="section hidden">
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search for a movie..." autocomplete="off" />
        <button id="search-btn">Search</button>
      </div>

      <!-- Search results -->
      <div id="search-results-wrap" class="hidden">
        <div class="section-header">
          <h2 id="search-heading">Results</h2>
          <div class="pagination" id="search-pagination"></div>
        </div>
        <div id="search-results" class="card-grid"></div>
        <div class="pagination bottom" id="search-pagination-bottom"></div>
      </div>

      <p id="search-empty" class="empty-msg hidden">No results found. Try a different keyword.</p>
    </section>

    <!-- POPULAR SECTION (shown by default) -->
    <section id="popular-section" class="section">
      <div class="section-header">
        <h2>Popular Movies</h2>
      </div>
      <div id="popular-results" class="card-grid"></div>
      <p id="popular-loading" class="loading-msg">Loading popular movies...</p>
    </section>

    <!-- DETAIL PANEL (hidden until a card is clicked) -->
    <section id="detail-section" class="section hidden">
      <button id="detail-back" class="back-btn">&larr; Back</button>
      <div id="detail-content"></div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer>
    <p>Data provided by <a href="https://www.themoviedb.org" target="_blank">TMDB</a> &mdash; IT 4403 Milestone 3</p>
  </footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
