<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Search Results — IT 4403 Milestone 1</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;600;700&display=swap');

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Lato', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
            line-height: 1.6;
        }

        /* ── Navigation ── */
        nav {
            background: #06402B;
            padding: 0 1.5rem;
        }
        nav ul {
            display: flex;
            flex-wrap: wrap;
            list-style: none;
            max-width: 1100px;
            margin: 0 auto;
        }
        nav ul li a {
            display: block;
            padding: 0.9rem 1.1rem;
            color: #c8e6d4;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background 0.2s, color 0.2s;
        }
        nav ul li a:hover { background: #0a5c38; color: #fff; }
        nav ul li a.active { background: #FFCE1B; color: #030057; }

        /* ── Header ── */
        header {
            background: linear-gradient(135deg, #06402B 0%, #0a7a4a 100%);
            color: #fff;
            text-align: center;
            padding: 2.5rem 1.5rem 2rem;
        }
        header h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.3rem; }
        header p  { font-size: 0.95rem; opacity: 0.8; }

        /* ── Main ── */
        main {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1.25rem;
        }

        /* ── Status / error ── */
        #status-message {
            text-align: center;
            padding: 3rem;
            color: #666;
            font-size: 1rem;
        }
        #status-message.error { color: #c0392b; }

        /* ── Results header ── */
        #results-header {
            display: none;
            margin-bottom: 1.25rem;
        }
        #results-header h2 {
            font-size: 1.15rem;
            color: #06402B;
            font-weight: 600;
        }
        #results-header .query-tag {
            display: inline-block;
            background: #06402B;
            color: #fff;
            padding: 0.15rem 0.7rem;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-left: 0.4rem;
        }
        #results-header .total-count {
            font-size: 0.88rem;
            color: #666;
            margin-top: 0.25rem;
        }

        /* ── Book grid ── */
        #book-grid {
            display: none;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.25rem;
        }

        /* ── Individual book card ── */
        .book-card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: box-shadow 0.2s, transform 0.15s;
        }
        .book-card:hover {
            box-shadow: 0 4px 14px rgba(0,0,0,0.13);
            transform: translateY(-2px);
        }

        /* Thumbnail */
        .card-thumb {
            background: #c8e6d4;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
            min-height: 180px;
        }
        .card-thumb img {
            max-height: 160px;
            max-width: 120px;
            border-radius: 3px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.22);
            display: block;
        }
        .card-thumb .no-thumb {
            color: #567;
            font-size: 0.78rem;
            text-align: center;
        }

        /* Card body */
        .card-body {
            padding: 1rem 1.1rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }
        .card-title {
            font-size: 0.98rem;
            font-weight: 700;
            color: #06402B;
            line-height: 1.35;
        }
        .card-subtitle {
            font-size: 0.82rem;
            color: #666;
            font-style: italic;
        }
        .card-authors {
            font-size: 0.85rem;
            color: #333;
        }
        .card-meta {
            font-size: 0.82rem;
            color: #666;
        }
        .card-rating {
            font-size: 0.82rem;
            color: #e6a817;
        }
        .card-description {
            font-size: 0.83rem;
            color: #555;
            line-height: 1.55;
            margin-top: 0.3rem;
            flex: 1;

            /* Clamp to 4 lines */
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Card footer: links */
        .card-footer {
            padding: 0.75rem 1.1rem;
            border-top: 1px solid #eef1f5;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .card-footer a {
            font-size: 0.8rem;
            font-weight: 500;
            padding: 0.3rem 0.7rem;
            border-radius: 4px;
            text-decoration: none;
            transition: opacity 0.15s;
        }
        .card-footer a:hover { opacity: 0.8; }
        .btn-primary   { background: #06402B; color: #fff; }
        .btn-secondary { background: #e8f5ee; color: #06402B; border: 1px solid #b8e6d0; }

        /* ── Footer ── */
        footer {
            text-align: center;
            padding: 1.5rem;
            font-size: 0.83rem;
            color: #777;
            border-top: 1px solid #dde;
            margin-top: 2rem;
        }

        /* ── Responsive ── */
        @media (max-width: 800px) {
            #book-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 500px) {
            #book-grid { grid-template-columns: 1fr; }
            header h1 { font-size: 1.35rem; }
        }
    </style>
</head>
<body>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="google-book.html">Single Book</a></li>
            <li><a href="google-books-search.html" class="active">Book Search</a></li>
            <li><a href="https://ccse.kennesaw.edu/it/" target="_blank" rel="noopener">CCSE IT Website</a></li>
        </ul>
    </nav>

    <header>
        <h1>Google Books &mdash; Search Results</h1>
        <p>IT 4403 &mdash; Individual Project &mdash; Milestone 1</p>
    </header>

    <main>
        <div id="status-message">Loading search results&hellip;</div>

        <div id="results-header">
            <h2>
                Search Results for
                <span class="query-tag" id="search-query">modern web</span>
            </h2>
            <p class="total-count" id="total-count"></p>
        </div>

        <div id="book-grid" role="list"></div>
    </main>

    <footer>
        <p>
            &copy; <span id="footer-year"></span> DJENKEU EDOU Livyo Kurtys &mdash;
            IT 4403 Individual Project &mdash; Kennesaw State University
        </p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        // Upgrade http:// image URLs to https:// (Azure serves over HTTPS).
        function secureUrl(url) {
            return url ? url.replace(/^http:\/\//i, 'https://') : '';
        }

        // Escape a string so it is safe to insert as HTML text.
        function esc(str) {
            return $('<span>').text(str || '').html();
        }

        // Build a compact star string for a rating value.
        function stars(rating) {
            var full  = Math.floor(rating);
            var half  = (rating - full) >= 0.5 ? 1 : 0;
            var empty = 5 - full - half;
            return '&#9733;'.repeat(full) +
                   (half ? '&#9734;' : '') +
                   '&#9734;'.repeat(empty) +
                   '\u00a0' + rating.toFixed(1);
        }

        $(function () {

            $.getJSON('google-books-search.json', function (data) {
                var items = data.items || [];

                // Results header
                var shown    = items.length;
                var total    = data.totalItems || 0;
                var countMsg = 'Showing ' + shown + ' of ' +
                    total.toLocaleString() + ' total results';
                $('#total-count').text(countMsg);
                $('#results-header').show();

                if (!items.length) {
                    $('#status-message').text('No results found.');
                    return;
                }

                // Build one card per book
                $.each(items, function (i, item) {
                    var v = item.volumeInfo || {};

                    // Thumbnail
                    var thumbUrl = (v.imageLinks && v.imageLinks.thumbnail)
                        ? secureUrl(v.imageLinks.thumbnail)
                        : null;
                    var thumbHtml = thumbUrl
                        ? '<img src="' + esc(thumbUrl) + '" alt="' + esc(v.title) + ' cover" />'
                        : '<div class="no-thumb">No cover<br>available</div>';

                    // Authors
                    var authorsText = (v.authors && v.authors.length)
                        ? v.authors.join(', ')
                        : 'Unknown author';

                    // Publisher + year
                    var metaParts = [];
                    if (v.publisher)     metaParts.push(esc(v.publisher));
                    if (v.publishedDate) metaParts.push(esc(v.publishedDate.substring(0, 4)));
                    if (v.pageCount)     metaParts.push(v.pageCount + ' pages');
                    var metaText = metaParts.join(' &bull; ');

                    // Rating
                    var ratingHtml = '';
                    if (v.averageRating) {
                        ratingHtml = '<p class="card-rating">' + stars(v.averageRating);
                        if (v.ratingsCount) {
                            ratingHtml += ' <span style="color:#888;font-size:0.78rem">(' +
                                v.ratingsCount + ')</span>';
                        }
                        ratingHtml += '</p>';
                    }

                    // Description
                    var descHtml = v.description
                        ? '<p class="card-description">' + esc(v.description) + '</p>'
                        : '';

                    // Subtitle
                    var subtitleHtml = v.subtitle
                        ? '<p class="card-subtitle">' + esc(v.subtitle) + '</p>'
                        : '';

                    // Footer links
                    var linksHtml = '';
                    if (v.previewLink) {
                        linksHtml += '<a href="' + esc(secureUrl(v.previewLink)) + '" ' +
                            'target="_blank" rel="noopener" class="btn-primary">Preview</a>';
                    }
                    if (v.infoLink) {
                        linksHtml += '<a href="' + esc(secureUrl(v.infoLink)) + '" ' +
                            'target="_blank" rel="noopener" class="btn-secondary">More Info</a>';
                    }

                    var cardHtml =
                        '<div class="book-card" role="listitem">' +
                            '<div class="card-thumb">' + thumbHtml + '</div>' +
                            '<div class="card-body">' +
                                '<p class="card-title">' + esc(v.title || 'Unknown Title') + '</p>' +
                                subtitleHtml +
                                '<p class="card-authors">' + esc(authorsText) + '</p>' +
                                (metaText ? '<p class="card-meta">' + metaText + '</p>' : '') +
                                ratingHtml +
                                descHtml +
                            '</div>' +
                            (linksHtml ? '<div class="card-footer">' + linksHtml + '</div>' : '') +
                        '</div>';

                    $('#book-grid').append(cardHtml);
                });

                // Reveal grid
                $('#status-message').hide();
                $('#book-grid').show();

            }).fail(function () {
                $('#status-message')
                    .addClass('error')
                    .text('Error: could not load google-books-search.json. ' +
                          'Ensure the file is in the same directory and you are ' +
                          'serving the page from a web server (not file://).');
            });
        });

        document.getElementById('footer-year').textContent = new Date().getFullYear();
    </script>

</body>
</html>
