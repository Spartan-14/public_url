<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineScope — Milestone 5</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- NAV -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container-fluid px-3 px-md-4">
      <a class="navbar-brand fw-black" href="#">Cine<span class="logo-badge">Scope</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link active" id="nav-collection" href="#">Collection</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" id="nav-search" href="#">Search</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="container-fluid py-3 px-3 px-md-4">

    <!-- COLLECTION SECTION -->
    <section id="collection-section" class="section">

      <!-- Tabs + view toggles -->
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
        <ul class="nav nav-tabs border-0" id="collection-tabs">
          <li class="nav-item">
            <button class="nav-link active" id="tab-popular">Popular</button>
          </li>
          <li class="nav-item">
            <button class="nav-link" id="tab-toprated">Top Rated</button>
          </li>
        </ul>
        <div class="btn-group btn-group-sm">
          <button class="btn btn-outline-warning active" id="view-grid-collection" title="Grid view">&#9783; Grid</button>
          <button class="btn btn-outline-warning" id="view-list-collection" title="List view">&#9776; List</button>
        </div>
      </div>

      <div id="collection-results" class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 g-3"></div>
      <p id="collection-loading" class="loading-msg">Loading movies...</p>
    </section>

    <!-- SEARCH SECTION -->
    <section id="search-section" class="section hidden">

      <div class="input-group mb-3">
        <input type="text" id="search-input"
               class="form-control bg-dark text-light border-secondary"
               placeholder="Search for a movie..."
               autocomplete="off" />
        <button id="search-btn" class="btn btn-warning fw-bold">Search</button>
      </div>

      <div id="search-results-wrap" class="hidden">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
          <h2 id="search-heading" class="h5 mb-0">Results</h2>
          <div class="d-flex align-items-center gap-2 flex-wrap">
            <div class="btn-group btn-group-sm">
              <button class="btn btn-outline-warning active" id="view-grid-search" title="Grid view">&#9783; Grid</button>
              <button class="btn btn-outline-warning" id="view-list-search" title="List view">&#9776; List</button>
            </div>
            <nav aria-label="Search pagination top">
              <ul class="pagination pagination-sm mb-0" id="search-pagination"></ul>
            </nav>
          </div>
        </div>

        <div id="search-results" class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 g-3"></div>

        <nav aria-label="Search pagination bottom" class="mt-3">
          <ul class="pagination pagination-sm justify-content-center" id="search-pagination-bottom"></ul>
        </nav>
      </div>

      <p id="search-empty" class="empty-msg hidden">No results found. Try a different keyword.</p>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="bg-black border-top border-secondary text-center py-3 mt-auto">
    <small class="text-muted">
      Data provided by <a href="https://www.themoviedb.org" target="_blank" class="text-warning text-decoration-none">TMDB</a>
      &mdash; IT 4403 Milestone 5
    </small>
  </footer>

  <!-- MOVIE DETAIL MODAL -->
  <div class="modal fade" id="detail-modal" tabindex="-1"
       aria-labelledby="modal-movie-title" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content bg-dark text-light border-secondary">
        <div class="modal-header border-secondary">
          <h5 class="modal-title" id="modal-movie-title">Loading...</h5>
          <button type="button" class="btn-close btn-close-white"
                  data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="modal-body-content">
          <p class="text-muted">Loading details...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- MUSTACHE TEMPLATES -->

  <!-- Card template (grid view) -->
  <script id="tpl-card" type="text/template">
    <div class="col movie-card" data-id="{{id}}">
      <div class="card h-100 bg-dark text-light border-secondary">
        {{#poster_url}}
          <img src="{{poster_url}}" class="card-img-top" alt="{{title}} poster" loading="lazy"
               style="aspect-ratio:2/3;object-fit:cover;">
        {{/poster_url}}
        {{^poster_url}}
          <div class="card-img-top d-flex align-items-center justify-content-center text-muted small"
               style="aspect-ratio:2/3;background:#242424;">No Image</div>
        {{/poster_url}}
        <div class="card-body p-2">
          <p class="card-title fw-semibold mb-1 small lh-sm">{{title}}</p>
          <p class="card-text text-muted small mb-1">{{year}}</p>
          {{#rating}}<span class="badge bg-warning text-dark">&#9733; {{rating}}</span>{{/rating}}
        </div>
      </div>
    </div>
  </script>

  <!-- List item template (list view) -->
  <script id="tpl-list-item" type="text/template">
    <div class="list-group-item list-group-item-action bg-dark text-light border-secondary movie-card d-flex gap-3 p-2"
         data-id="{{id}}">
      {{#poster_url}}
        <img src="{{poster_url}}" loading="lazy" alt="{{title}} poster"
             class="rounded flex-shrink-0"
             style="width:60px;height:90px;object-fit:cover;">
      {{/poster_url}}
      {{^poster_url}}
        <div class="rounded flex-shrink-0 d-flex align-items-center justify-content-center text-muted small"
             style="width:60px;height:90px;background:#242424;">No Image</div>
      {{/poster_url}}
      <div class="overflow-hidden">
        <h6 class="mb-1 text-truncate">{{title}}</h6>
        <div class="d-flex align-items-center gap-2 flex-wrap mb-1">
          <small class="text-muted">{{year}}</small>
          {{#rating}}<span class="badge bg-warning text-dark">&#9733; {{rating}}</span>{{/rating}}
        </div>
        {{#overview}}<p class="mb-0 small text-muted list-overview">{{overview}}</p>{{/overview}}
      </div>
    </div>
  </script>

  <!-- Detail template (rendered inside modal body) -->
  <script id="tpl-detail" type="text/template">
    <div class="row g-3">
      <div class="col-auto">
        {{#poster_url}}
          <img src="{{poster_url}}" class="rounded shadow" alt="{{title}} poster"
               style="width:160px;display:block;">
        {{/poster_url}}
        {{^poster_url}}
          <div class="rounded d-flex align-items-center justify-content-center text-muted small"
               style="width:160px;height:240px;background:#242424;">No Image</div>
        {{/poster_url}}
      </div>
      <div class="col">
        <div class="d-flex flex-wrap gap-1 mb-3">
          {{#rating}}<span class="badge bg-warning text-dark">&#9733; {{rating}}</span>{{/rating}}
          {{#year}}<span class="badge bg-secondary">{{year}}</span>{{/year}}
          {{#runtime}}<span class="badge bg-secondary">{{runtime}}</span>{{/runtime}}
          {{#language}}<span class="badge border border-secondary text-light">{{language}}</span>{{/language}}
          {{#genres}}<span class="badge border border-warning text-warning">{{name}}</span>{{/genres}}
        </div>
        <p class="small lh-lg">{{overview}}</p>
        {{#tagline}}<p class="fst-italic text-warning small mb-0">&ldquo;{{tagline}}&rdquo;</p>{{/tagline}}
      </div>
    </div>
  </script>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/mustache.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
