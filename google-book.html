<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single Book - Google Books JSON</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script>
        $(function() {
            $.getJSON("google-book.json", function(data) {

                var info = data.volumeInfo || {};

                $("#book-title").text(info.title || "Unknown Title");
                $("#book-subtitle").text(info.subtitle || "");
                $("#book-authors").text(info.authors ? info.authors.join(", ") : "Unknown Author");
                $("#book-publisher").text(info.publisher || "Unknown Publisher");
                $("#book-published").text(info.publishedDate || "Unknown Date");
                $("#book-pages").text(info.pageCount ? info.pageCount + "pages" : "");
                $("#book-language").text(info.language ? info.langauge.toUpperCase() : "");

                if (info.imageLinks && info.imageLinks.thumbnail) {
                    var img = $("<img>")
                        .attr("src", info.imageLinks.thumbnail)
                        .attr("alt", info.title || "Book Cover");
                    $("#book-cover").empty().append(img);
                } else {
                    $("#book-cover").text("No cover image available.");
                }
                $("#book-description").html(info.description || "No description available.");
            }).fail(function () {
                $("#book-title").text("Error loading book data");
                 $("#book-description").text("Could not load google-books-book.json");
            });
        });
    </script>
</head>
<body>
    <header>
        <h1>Google Books API - Single Book Details</h1>
        <p>IT 4403 - Individual Project - Milestone 1</p>
    </header>

    <main>
        <section>
            <h2>Book Details</h2>
            <div id="book-container">
                <div id="book-cover"></div>
                <h3 id="book-title">Loading title...</h3>
                <h4 id="book-subtitle"></h4>

                <p><strong>Author(s):</strong> <span id="book-authors"></span></p>
                <p><strong>Publisher:</strong> <span id="book-publisher"></span></p>
                <p><strong>Published:</strong> <span id="book-published"></span></p>
                <p><strong>Pages:</strong> <span id="book-pages"></span></p>
                <p><strong>Language:</strong> <span id="book-language"></span></p>
                <!-- Book details will be dynamically inserted here -->

                <h3>Description</h3>
                <div id="book-description">Loading description...</div>
            </div>
        </section>
    </main>
</body>
</html>
